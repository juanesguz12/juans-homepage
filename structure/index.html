<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">

        
        <title>Deadlock Heroes</title>
        <link rel="stylesheet" href="main.css">

       
    </head>

    <body>
<!--SMALL SIGN-->

<div class="city-sign">

    <p>THE CURSED APPLE</p>

    <h1>
        MEET THE<br>
        LOCALS
    </h1>

    <p>
        CLICK A POSTER<br>
        TO LEARN MORE
    </p>

</div>



<!-- BILLBOARD / WALL-->

<main class="billboard">


    <!-- POSTER 1 -->

    <a href="#character1"
       class="poster poster-one">

        <img src="1.webp"
             alt="Deadlock character poster">

    </a>



    <!-- POSTER 2 -->

    <a href="#character2"
       class="poster poster-two">

        <img src="2.webp"
             alt="Deadlock character poster">

    </a>



    <!-- POSTER 3 -->

    <a href="#character3"
       class="poster poster-three">

        <img src="3.webp"
             alt="Deadlock character poster">

    </a>



    <!-- POSTER 4 -->

    <a href="#character4"
       class="poster poster-four">

        <img src="4.webp"
             alt="Deadlock character poster">

    </a>



    <!-- POSTER 5 -->

    <a href="#character5"
       class="poster poster-five">

        <img src="5.webp"
             alt="Deadlock character poster">

    </a>



    <!-- POSTER 6 -->

    <a href="#character6"
       class="poster poster-six">

        <img src="6.webp"
             alt="Deadlock character poster">

    </a>



    <!-- RANDOM WALL WRITING -->

    <p class="wall-text wall-text-one">
        THE CITY NEVER SLEEPS
    </p>


    <p class="wall-text wall-text-two">
        WHO CAN YOU TRUST?
    </p>


    <p class="wall-text wall-text-three">
        NEW YORK CITY
    </p>


</main>



<!--CHARACTER 1-->

<section id="character1"
         class="character-box">


    <div class="character-card">


        <!-- CLOSE -->

        <a href="#"
           class="close">

            ×

        </a>



        <!-- IMAGE -->

        <div class="character-picture">

            <img src="solomon-from-deadlock-v0-6kwxujtydpsh1.webp"
                 alt="Character">

        </div>



        <!-- INFORMATION -->

        <div class="character-info">

            <p class="character-number">
                RESIDENT / 01
            </p>


            <h2>
                SOLOMON<br>
                
            </h2>



            <p class="description">

               He plays chess.

            </p>



            <div class="abilities">

                <h3>ABILITIES</h3>

                <p>01 — ABILITY</p>

                <p>02 — ABILITY</p>

                <p>03 — ABILITY</p>

                <p>04 — ABILITY</p>

            </div>


        </div>


    </div>


</section>



    </body>

</html>
